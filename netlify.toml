[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'sha256-/J8UYySkrCeqsHi0GZ/joUNYojGG8JIhVVn2e6igSkI=' 'sha256-5x2p3tr0CzviYZSGbFss5v3BqN6QEsv4vjVBbP/c8Z8=' 'sha256-XqRoPcQ42A0mi5QlPotQKG2TmVuqgGC0zZEt3etiWqY=' 'sha256-e2eUoEizXbb8MLOGrzd3+H1UZr1pODumZP56l08upH4=' 'sha256-qbe4vooKCM862mUPiit1bX0yp8lD3PiTMhCVwyyeP2g=' 'sha256-z3s7aqndgjQrkioIa4ttqTYMig2ryiBD8ybUU9ITVHQ='; connect-src 'self'; frame-ancestors 'self'; form-action 'self';"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/chat-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
